      ip_str: { description: 指定的 IPv6 段 }
      bandwidth_num: { description: 购买时选定的增值带宽 }
      remark: { description: 备注 }
  /externalapi/product_order/createTestOrder:
    name: order_buy_test_ip
    title: 购买测试 IP
    description: 会从账户余额扣费并占用本月测试额度。每单按账号配置的测试订单金额扣款，测试有效期由平台配置决定，不能固定承诺 1 天。已删除的本月测试账号仍占额度，当前后端在本次数量大于或等于剩余额度时均拒绝；当前 MCP 没有专门的测试额度、金额和期限查询工具，先在网站核实。账号须先完成邮箱或手机验证以及实名验证才能购买。
    destructive: true
    params:
      agree: { enum: [SOCKS5, HTTP, HTTPS], description: 协议 }
      country: { description: 国家编码，用 country_list 查该产品可买的国家 }
      city: { description: 城市名称，取 city_list 返回的名称；不传随机 }
      use_random_username: { enum: [0, 1], description: 是否使用随机账号密码：0=否，1=是 }
  /externalapi/set_meal/renewOrder:
    split:
      - name: order_renew
        title: 续费时长 IP
        description: 会从账户余额扣费。续费静态住宅或数据中心的时长 IP 子账号，content 按国家分组，每组写子账号 id 列表、国家、续费时长；一次最多 200 个子账号。
        destructive: true
        params:
          content: { description: 续费内容，按国家分组，每组写 ids、country、timelen，可选 renew_with_bandwidth }
          "content[0][ids]": { description: 该组要续费的子账号 id 列表 }
          "content[0][ids][0]": { description: 续费的子账号 id }
          "content[0][country]": { description: 这组子账号的国家编码，传 sub_account_list 返回的 country 即可；后端以子账号库里记录的国家为准 }
          "content[0][timelen]": { enum: [0, 1, 2, 3, 4], description: 续费时长：0=7天，1=30天，2=90天，3=180天，4=360天 }
          "content[0][renew_with_bandwidth]": { enum: [0, 1], description: 是否连同带宽一起续费：0=只续子账号，1=子账号和带宽一起续 }
          conpon_id: { description: 用户优惠券编号，取 coupon_list 返回的 conpon_id }
        products: [static-standard, static-native, static-isp-native, datacenter]
      - name: order_renew_dynamic_bandwidth
        title: 续费动态不限流量带宽
        description: 会从账户余额扣费。续费一个动态住宅不限流量子账号，保留当前带宽；先用 sub_account_list 查询 dynamic-bandwidth，确认 can_renew=true。当前价格工具不含此产品，费用请先在网站核实并向用户确认。
        destructive: true
        products: [dynamic-bandwidth]
        params:
          sub_account_id: { description: "子账号编号，取 sub_account_list 的 rows[].sub_account，不是本地记录 id" } # 文档缺陷兜底：后端按 sub_account 定位，不能传本地 id
          timelen: { enum: [1, 2, 3], description: 续费时长：1=30天，2=90天，3=180天 }
          conpon_id: { description: 可选优惠券 id，取用户在网站确认的适用券；自定义价不能叠加优惠券 }
  /externalapi/set_meal/renewOrderIpv6:
